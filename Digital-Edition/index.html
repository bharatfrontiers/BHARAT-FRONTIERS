<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Edition — BHARAT FRONTIERS</title><link rel="icon" href="../Assets/Logos/bharat-frontiers-icon.png"><link rel="stylesheet" href="../style.css"><style>.edition-wrap{max-width:1150px;margin:auto;padding:45px 22px 80px}.edition-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}.edition-hero img{width:100%;border-radius:14px}.edition-card{border:1px solid #ddd;border-radius:14px;padding:24px}.edition-card h2{margin-top:0}.edition-card a{display:inline-block;margin:7px 8px 7px 0;padding:10px 14px;border:1px solid #222;border-radius:7px;text-decoration:none}.issue-list{margin-top:45px}.issue-list article{border-top:1px solid #ddd;padding:20px 0;display:flex;justify-content:space-between;gap:20px}@media(max-width:800px){.edition-hero{grid-template-columns:1fr}.issue-list article{display:block}}</style></head><body><header class="masthead"><div class="site-shell masthead-inner"><div class="masthead-brand"><a href="../index.html" class="masthead-logo-link"><img src="../Assets/Logos/bharat-frontiers-official-logo.png" alt="BHARAT FRONTIERS official logo" class="masthead-logo"></a><div class="masthead-copy"><a href="../index.html" class="masthead-title-link"><h1>BHARAT FRONTIERS</h1></a><p class="masthead-tagline">The Knowledge Post</p><p class="masthead-subline">SCIENCE <span>•</span> TECHNOLOGY <span>•</span> POLICY <span>•</span> BUSINESS</p></div></div></div></header><main class="edition-wrap"><div class="edition-hero"><img src="./Digital-Edition.png" alt="BHARAT FRONTIERS Digital Edition"><div class="edition-card"><span>MONTHLY DIGITAL PUBLICATION</span><h1>Monthly Newsletter / E-Paper</h1><p>Read the current month’s BHARAT FRONTIERS stories in the web edition or open the print-ready e-paper.</p><div id="current"></div></div></div><section class="issue-list"><h2>E-Paper Archive</h2><div id="archive">Loading issues…</div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));(async()=>{let issues=[];try{issues=(await fetch('../api/issues').then(r=>r.json())).issues||[]}catch(e){issues=await fetch('./editions.json').then(r=>r.json())}const cur=issues.find(x=>x.status==='current')||issues[0];if(cur)document.getElementById('current').innerHTML=`<h2>${esc(cur.title||cur.month_label||cur.id)}</h2><a href="./edition.html?edition=${encodeURIComponent(cur.id)}">Read this e-paper →</a>${cur.pdf_url?`<a href="${esc(cur.pdf_url)}" target="_blank" rel="noopener">Download PDF</a>`:''}`;document.getElementById('archive').innerHTML=issues.map(x=>`<article><div><h3>${esc(x.title||x.month_label||x.id)}</h3><p>${esc(x.month_label||'Monthly issue')}</p></div><div><a href="./edition.html?edition=${encodeURIComponent(x.id)}">Open e-paper</a>${x.pdf_url?` <a href="${esc(x.pdf_url)}" target="_blank" rel="noopener">PDF</a>`:''}</div></article>`).join('')||'<p>No issues have been published yet.</p>'})()</script></body></html>
