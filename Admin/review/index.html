<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Desk — BHARAT FRONTIERS</title><link rel="stylesheet" href="../../style.css"><style>.admin{max-width:1000px;margin:auto;padding:42px 20px}.card{padding:20px;border:1px solid #ddd;border-radius:14px;margin:14px 0}.field{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 14px;border:1px solid #ccc;border-radius:8px}.content{min-height:420px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer;margin:4px}.source{padding:9px 0;border-top:1px solid #eee}.ok{padding:10px;background:#eef8ee;border-radius:8px}.err{padding:10px;background:#fff0f0;border-radius:8px}</style></head><body><main class="admin"><h1>Editorial Review Desk</h1><div class="card"><label>Article slug</label><input id="slug" class="field" placeholder="paste article slug"><button class="btn" onclick="loadArticle()">Load Draft</button></div><div id="editor"></div><p><a href="../">← Admin</a></p></main><script>
const K=()=>sessionStorage.getItem('bf_admin_key')||'';const H=()=>({'content-type':'application/json','x-admin-key':K()});let current=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function loadArticle(){const slug=document.getElementById('slug').value.trim();if(!slug)return;try{const r=await fetch(`../../api/articles?slug=${encodeURIComponent(slug)}&preview=1`,{headers:H()});const d=await r.json();if(!r.ok)throw new Error(d.error||'Not found');current=d;document.getElementById('editor').innerHTML=`<div class="card"><h2>${esc(d.article.title)}</h2><p><b>Status:</b> ${esc(d.article.status)}</p><label>Title</label><input id="title" class="field" value="${esc(d.article.title)}"><label>Summary</label><textarea id="summary" class="field">${esc(d.article.summary)}</textarea><label>Content HTML</label><textarea id="content" class="field content">${esc(d.article.content_html)}</textarea><button class="btn" onclick="save('review')">Save & Mark Review</button><button class="btn" onclick="save('approved')">Save & Approve</button><button class="btn" onclick="publish()">Publish</button><h3>Verified References</h3>${(d.sources||[]).map((s,i)=>`<div class="source">[${i+1}] <a href="${esc(s.url)}" target="_blank">${esc(s.title)}</a> — ${esc(s.publisher)} (${esc(s.source_type)})</div>`).join('')}</div>`}catch(e){document.getElementById('editor').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function save(status){if(!current)return;const r=await fetch('../../api/admin-article',{method:'POST',headers:H(),body:JSON.stringify({slug:current.article.slug,title:document.getElementById('title').value,summary:document.getElementById('summary').value,content_html:document.getElementById('content').value,status})});const d=await r.json();document.getElementById('editor').insertAdjacentHTML('afterbegin',`<div class="${r.ok?'ok':'err'}">${esc(r.ok?`Saved as ${status}`:d.error)}</div>`)}
async function publish(){if(!current)return;await save('approved');const r=await fetch('../../api/publish-article',{method:'POST',headers:H(),body:JSON.stringify({slug:current.article.slug})});const d=await r.json();document.getElementById('editor').insertAdjacentHTML('afterbegin',`<div class="${r.ok?'ok':'err'}">${esc(r.ok?'Published successfully':d.error)}</div>`)}
const slugParam=new URLSearchParams(location.search).get('slug');if(slugParam){document.getElementById('slug').value=slugParam;loadArticle()}
</script></body></html>
