<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articles — BHARAT FRONTIERS</title><link rel="stylesheet" href="../../style.css"><style>.admin{max-width:1000px;margin:auto;padding:42px 20px}.card{padding:18px;border:1px solid #ddd;border-radius:14px;margin:12px 0}.btn{display:inline-block;padding:9px 13px;border-radius:8px;background:#111;color:#fff;text-decoration:none;margin:4px}.status{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;opacity:.6}</style></head><body><main class="admin"><h1>Articles</h1><p>Choose a workflow state.</p><div id="list">Loading…</div><p><a href="../">← Admin</a></p></main><script>
const K=()=>sessionStorage.getItem('bf_admin_key')||'';const H=()=>({'x-admin-key':K()});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
(async()=>{if(!K()){document.getElementById('list').innerHTML='<p>Open Admin home and save ADMIN_KEY first.</p>';return}const states=['draft','review','approved','published','archived'];let html='';for(const st of states){try{const r=await fetch(`../../api/articles?status=${st}`,{headers:H()});const d=await r.json();html+=`<h2>${st}</h2>`+(d.articles||[]).map(a=>`<div class="card"><span class="status">${esc(a.status)}</span><h3>${esc(a.title)}</h3><p>${esc(a.summary)}</p><a class="btn" href="../../Articles/article.html?slug=${encodeURIComponent(a.slug)}" target="_blank">Open public</a>${st!=='published'?`<a class="btn" href="../review/?slug=${encodeURIComponent(a.slug)}">Review</a>`:''}</div>`).join('')||'<p>No articles.</p>'}catch(e){html+=`<p>${esc(e.message)}</p>`}}document.getElementById('list').innerHTML=html})();</script><div style="max-width:1100px;margin:20px auto;padding:12px 16px;border:1px solid #ddd;background:#fafafa"><strong>Publication rule:</strong> NO VERIFIED SOURCE = NO PUBLICATION.</div></body></html>
