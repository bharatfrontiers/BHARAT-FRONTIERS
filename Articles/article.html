<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article — BHARAT FRONTIERS</title>
<meta name="description" content="">
<link rel="icon" type="image/png" href="../Assets/Logos/bharat-frontiers-icon.png">
<link rel="stylesheet" href="../style.css">
<style>
.article-shell{max-width:1050px;margin:0 auto;padding:44px 22px 80px}
.article-header{max-width:900px;margin:auto}.article-eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.article-header h1{font-size:clamp(2.3rem,5vw,4.6rem);line-height:1.03;margin:.5rem 0 1rem}
.article-dek{font-size:1.2rem;line-height:1.7;max-width:800px}.article-meta{color:#666;margin:18px 0}
.article-hero{margin:35px auto;max-width:900px}.article-hero img{display:block;width:100%;max-height:560px;object-fit:cover;border-radius:14px}
.article-content{max-width:800px;margin:0 auto;font-size:1.08rem;line-height:1.85}
.article-content h2{font-size:1.7rem;margin-top:2.2rem}.article-content p{margin:1rem 0}
.sources-box,.more-info-box{max-width:800px;margin:45px auto 0;padding:25px;border-top:2px solid #111}
.sources-box li,.more-info-box li{margin:.8rem 0;line-height:1.55}.source-type{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.related{max-width:1000px;margin:60px auto 0}.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.related-card{border:1px solid #ddd;border-radius:12px;padding:18px}.related-card h3{margin-top:0}.print-actions{display:flex;gap:10px;margin:20px 0}
.print-actions button{padding:10px 14px;cursor:pointer;border:1px solid #222;background:#fff}
.source-gate{padding:12px 15px;border:1px solid #ddd;background:#fafafa;margin:20px 0}
.comments-section{max-width:800px;margin:70px auto 0;padding-top:35px;border-top:2px solid #111}
.comments-intro{color:#666;line-height:1.7}
.comment-form{margin-top:25px;padding:24px;border:1px solid #ddd;border-radius:14px;background:#fafafa}
.comment-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.comment-field{display:flex;flex-direction:column;gap:7px}
.comment-field.full{grid-column:1/-1}
.comment-field label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.comment-field input,.comment-field textarea{width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;padding:11px 12px;font:inherit;background:#fff}
.comment-field textarea{min-height:150px;resize:vertical}
.comment-type{display:flex;gap:18px;flex-wrap:wrap;font-size:.95rem}
.comment-type label{display:flex;align-items:center;gap:7px;font-size:.9rem;font-weight:400;letter-spacing:0;text-transform:none}
.comment-submit{margin-top:16px;padding:11px 18px;border:1px solid #111;background:#111;color:#fff;border-radius:8px;cursor:pointer}
.comment-submit:disabled{opacity:.6;cursor:wait}
.comment-note{font-size:.84rem;color:#666;margin-top:10px;line-height:1.55}
.comment-message{margin-top:14px;padding:11px 13px;border-radius:8px;display:none}
.comment-message.ok{display:block;background:#eef8ee;color:#245b2a}
.comment-message.err{display:block;background:#fff0f0;color:#7a2525}
.comment-list{margin-top:35px}
.comment-item{padding:20px 0;border-top:1px solid #ddd}
.comment-item .comment-meta{font-size:.82rem;color:#666;margin-bottom:8px}
.comment-item .comment-kind{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:#111}
.comment-item p{white-space:pre-wrap;line-height:1.7;margin:.5rem 0 0}
.comment-empty{padding:20px 0;color:#666}
.honeypot{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
@media(max-width:760px){.related-grid{grid-template-columns:1fr}.article-header h1{font-size:2.5rem}.comment-form-grid{grid-template-columns:1fr}.comment-field.full{grid-column:auto}}
@media(max-width:760px){.related-grid{grid-template-columns:1fr}.article-header h1{font-size:2.5rem}}
</style>
</head>
<body>
<div class="utility-bar"><div class="site-shell utility-inner">
<div class="utility-left"><a href="../">THE KNOWLEDGE POST</a><span class="utility-separator">•</span><a href="./">Latest</a></div>
<div class="utility-right"><a href="../Digital-Edition/">Digital Edition</a><a href="../">Home</a></div>
</div></div>
<header class="masthead"><div class="site-shell masthead-inner">
<div class="masthead-brand"><a href="../index.html" class="masthead-logo-link"><img src="../Assets/Logos/bharat-frontiers-official-logo.png" alt="BHARAT FRONTIERS official logo" class="masthead-logo"></a>
<div class="masthead-copy"><a href="../index.html" class="masthead-title-link"><h1>BHARAT FRONTIERS</h1></a><p class="masthead-tagline">The Knowledge Post</p><p class="masthead-subline">SCIENCE <span>•</span> TECHNOLOGY <span>•</span> POLICY <span>•</span> BUSINESS</p></div>
</div></div></header>
<nav class="navigation"><div class="site-shell navigation-inner">
<a href="../">Home</a><a href="./category.html?category=Science">Science</a><a href="./category.html?category=Technology">Technology</a><a href="./category.html?category=Policy">Policy</a><a href="./category.html?category=Business">Business</a><a href="./category.html?category=Research">Research</a><a href="./category.html?category=Analysis">Analysis</a><a href="./category.html?category=Innovation">Innovation</a><a href="./category.html?category=Culture">Culture</a><a href="../Digital-Edition/">Digital Edition</a>
</div></nav>
<main class="article-shell" id="article">Loading article…</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safeUrl=u=>{try{const x=new URL(u,location.href);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return '#'}};
const cleanContent=s=>String(s||'').replace(/<script[\s\S]*?<\/script>/gi,'');
function fallbackData(){
  return fetch('../Data/articles.json').then(r=>r.json()).then(d=>d.find(x=>x.slug===new URLSearchParams(location.search).get('slug')));
}
async function load(){
 const slug=new URLSearchParams(location.search).get('slug');
 let payload=null;
 try{const r=await fetch('../api/articles?slug='+encodeURIComponent(slug));if(r.ok)payload=await r.json()}catch{}
 if(!payload?.article){
   const a=await fallbackData();
   if(!a || a.status!=='published' || !Array.isArray(a.sources)||!a.sources.length){
     document.getElementById('article').innerHTML='<h1>Article unavailable</h1><p>This story has not passed the publication source-verification gate.</p>';
     return;
   }
   payload={article:a,related:[]};
 }
 const a=payload.article;
 document.title=(a.title||'Article')+' — BHARAT FRONTIERS';
 document.querySelector('meta[name="description"]').content=a.summary||'';
 const sources=(a.sources||[]).filter(s=>s.verified!==0);
 const moreInfo=Array.isArray(a.more_info)?a.more_info:[];
 const image=a.image?String(a.image):'';
 document.getElementById('article').innerHTML=`
   <header class="article-header">
    <div class="article-eyebrow">${esc(a.section||'')} · ${esc(a.type||'')}</div>
    <h1>${esc(a.title)}</h1>
    ${a.subtitle?`<p class="article-dek">${esc(a.subtitle)}</p>`:''}
    <p class="article-dek">${esc(a.summary||'')}</p>
    <div class="article-meta">${esc(a.author||'BHARAT FRONTIERS Editorial Desk')} · ${esc(a.published_at||a.date||'')}</div>
    <div class="print-actions"><button onclick="window.print()">Print / Save as PDF</button></div>
   </header>
   ${image?`<figure class="article-hero"><img src="${safeUrl(image)}" alt="${esc(a.title)}"></figure>`:''}
   <article class="article-content">${cleanContent(a.content_html||a.content||'<p>No published article content is available.</p>')}</article>
   <section class="sources-box"><h2>Sources &amp; References</h2>
     <ol>${sources.map(s=>`<li><span class="source-type">${esc(s.source_type||'verified source')}</span> — <a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.url)}</a>${s.publisher?` — ${esc(s.publisher)}`:''}</li>`).join('')}</ol>
   </section>
   ${moreInfo.length?`<section class="more-info-box"><h2>For More Info</h2><p>For more information about the topics discussed in this article, please visit these reputed resources:</p><ul>${moreInfo.map(x=>`<li>For more info about <strong>${esc(x.about||x.title||'this topic')}</strong>, <a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">please click here</a>.</li>`).join('')}</ul></section>`:''}
   ${payload.related?.length?`<section class="related"><h2>Related Stories</h2><div class="related-grid">${payload.related.map(r=>`<article class="related-card"><div class="meta">${esc(r.section||'')}</div><h3><a href="article.html?slug=${encodeURIComponent(r.slug)}">${esc(r.title)}</a></h3><p>${esc(r.summary||'')}</p><a class="read" href="article.html?slug=${encodeURIComponent(r.slug)}">Read article →</a></article>`).join('')}</div></section>`:''}
   <section class="comments-section" id="comments">
     <h2>Comments &amp; Queries</h2>
     <p class="comments-intro">Have a question, observation, or comment about this article? Share it with BHARAT FRONTIERS. Your e-mail is required so the editorial office can respond to you directly. Your e-mail address will not be displayed publicly.</p>
     <form class="comment-form" id="commentForm">
       <div class="comment-form-grid">
         <div class="comment-field"><label for="commentName">Name *</label><input id="commentName" name="name" maxlength="100" required autocomplete="name"></div>
         <div class="comment-field"><label for="commentEmail">E-mail *</label><input id="commentEmail" name="email" type="email" maxlength="254" required autocomplete="email"></div>
         <div class="comment-field full"><label>Type *</label><div class="comment-type"><label><input type="radio" name="kind" value="comment" checked> Comment</label><label><input type="radio" name="kind" value="query"> Query</label></div></div>
         <div class="comment-field full"><label for="commentBody">Your comment or question *</label><textarea id="commentBody" name="body" maxlength="4000" required placeholder="Write your comment or question..."></textarea></div>
       </div>
       <div class="honeypot" aria-hidden="true"><label>Website<input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
       <button class="comment-submit" id="commentSubmit" type="submit">Submit</button>
       <p class="comment-note">Submissions are reviewed before appearing publicly. BHARAT FRONTIERS uses the supplied e-mail only for editorial communication and response.</p>
       <div class="comment-message" id="commentMessage"></div>
     </form>
     <div class="comment-list" id="commentList"><p class="comment-empty">Loading comments…</p></div>
   </section>
 `;
 initComments(slug);
}

async function loadComments(slug){
  const list=document.getElementById('commentList');
  try{
    const r=await fetch('../api/comments?slug='+encodeURIComponent(slug));
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Comments unavailable');
    const comments=d.comments||[];
    list.innerHTML=comments.length?comments.map(c=>`<article class="comment-item"><div class="comment-meta"><strong>${esc(c.name)}</strong> · ${esc(c.kind==='query'?'Query':'Comment')} · ${esc(new Date(c.created_at).toLocaleDateString())}</div><p>${esc(c.body)}</p></article>`).join(''):'<p class="comment-empty">No published comments yet. Be the first to start the discussion.</p>';
  }catch(e){list.innerHTML='<p class="comment-empty">No published comments yet. Comments and queries are reviewed before publication.</p>'}
}

function initComments(slug){
  loadComments(slug);
  const form=document.getElementById('commentForm');
  const submit=document.getElementById('commentSubmit');
  const message=document.getElementById('commentMessage');
  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    submit.disabled=true;
    message.className='comment-message'; message.textContent='Submitting…';
    try{
      const fd=new FormData(form);
      const payload={slug,name:String(fd.get('name')||''),email:String(fd.get('email')||''),kind:String(fd.get('kind')||'comment'),body:String(fd.get('body')||''),website:String(fd.get('website')||'')};
      const r=await fetch('../api/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Submission failed');
      message.className='comment-message ok';
      message.textContent=d.message||'Thank you. Your submission is awaiting editorial review.';
      form.reset();
      document.querySelector('input[name="kind"][value="comment"]').checked=true;
    }catch(e){message.className='comment-message err';message.textContent=e.message||'Unable to submit. Please try again.'}
    finally{submit.disabled=false}
  });
}

load();
</script>
</body></html>
